name: Weekly Build and Update Latest Release

on:
  schedule:
    - cron: '0 0 * * 1'  # Every Monday at 00:00 UTC. Change as needed (e.g., '0 0 * * 0' for Sunday).
  workflow_dispatch:  # Optional: allows manual triggering from the GitHub UI
  pull_request:

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ipinfo
        run: |
          go install .

      - name: Checkout data
        uses: actions/checkout@v4
        with:
          repository: 'disposable/cloud-ip-ranges'
          path: cloud-ip-ranges

      - name: Cloud Providers
        run: |
          ipinfo -disp-cloud-dir cloud-ip-ranges -output cloud.bin
          zstd cloud.bin
          gh release upload --clobber index cloud.bin.zst

      - name: ASN Lite
        run: |
          wget -q https://git.io/GeoLite2-ASN.mmdb
          ipinfo -mmdb GeoLite2-ASN.mmdb -mmdb-type asn -output asn-lite.bin
          zstd asn-lite.bin
          gh release upload --clobber index asn-lite.bin.zst

      - name: City Lite
        run: |
          wget -q https://git.io/GeoLite2-City.mmdb
          ipinfo -mmdb GeoLite2-City.mmdb -mmdb-type city -output city-lite.bin
          zstd city-lite.bin
          gh release upload --clobber index city-lite.bin.zst

      - name: Country Lite
        run: |
          wget -q https://git.io/GeoLite2-Country.mmdb
          ipinfo -mmdb GeoLite2-Country.mmdb -mmdb-type country -output country-lite.bin
          zstd country-lite.bin
          gh release upload --clobber index country-lite.bin.zst
