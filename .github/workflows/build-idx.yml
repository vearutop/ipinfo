name: Weekly build and update IP DB indexes

on:
  schedule:
    - cron: '1 10 * * 2'  # Every Tuesday at 01:10 UTC.
  workflow_dispatch:

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ipinfo
        run: |
          go install .

      - name: Checkout cloud providers repo
        uses: actions/checkout@v4
        with:
          repository: 'disposable/cloud-ip-ranges'
          path: cloud-ip-ranges

      - name: Cloud providers
        run: |
          ipinfo -disp-cloud-dir cloud-ip-ranges -output cloud.bin
          zstd cloud.bin
          gh release upload --clobber index cloud.bin.zst

      - name: ASN lite
        run: |
          ipinfo -mmdb https://git.io/GeoLite2-ASN.mmdb -mmdb-type asn -output asn-lite.bin
          zstd asn-lite.bin
          gh release upload --clobber index asn-lite.bin.zst

      - name: City lite
        run: |
          ipinfo -mmdb https://git.io/GeoLite2-City.mmdb -mmdb-type city -output city-lite.bin
          zstd city-lite.bin
          gh release upload --clobber index city-lite.bin.zst

      - name: City location lite
        run: |
          ipinfo -mmdb https://git.io/GeoLite2-City.mmdb -mmdb-type city-loc -output city-loc-lite.bin
          zstd city-loc-lite.bin
          gh release upload --clobber index city-loc-lite.bin.zst

      - name: Country lite
        run: |
          ipinfo -mmdb https://git.io/GeoLite2-Country.mmdb -mmdb-type country -output country-lite.bin
          zstd country-lite.bin
          gh release upload --clobber index country-lite.bin.zst
