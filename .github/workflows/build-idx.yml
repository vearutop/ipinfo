name: Weekly Build and Update Latest Release

on:
  schedule:
    - cron: '0 0 * * 1'  # Every Monday at 00:00 UTC. Change as needed (e.g., '0 0 * * 0' for Sunday).
  workflow_dispatch:  # Optional: allows manual triggering from the GitHub UI
  pull_request:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout data
        uses: actions/checkout@v4
        with:
          repository: 'disposable/cloud-ip-ranges'
          path: cloud-ip-ranges

      - name: Build indexes
        run: |
          go install .
          ipinfo -disp-cloud-dir cloud-ip-ranges -output cloud.bin

      - name: Get release
        id: get_release
        uses: bruceadams/get-release@v1.3.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload cloud.bin
        if: hashFiles('cloud.bin') != ''
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_path: ./cloud.bin
          asset_name: cloud.bin
          asset_content_type: application/octet-stream
